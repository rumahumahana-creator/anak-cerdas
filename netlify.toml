[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.processing.secrets_scanning]
  omit_keys = ["VITE_SUPABASE_ANON_KEY", "VITE_SUPABASE_URL", "CATALOG_ACCESS_PASSWORD", "CATALOG_SESSION_SECRET"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

